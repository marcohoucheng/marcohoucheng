name: Sync README to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/sync-readme.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v6
        with:
          path: profile

      - name: Checkout github.io repo
        uses: actions/checkout@v6
        with:
          repository: marcohoucheng/marcohoucheng.github.io
          token: ${{ secrets.GH_PAGES_PAT }}
          path: pages

      - name: Copy README → index.md
        run: cp profile/README.md pages/index.md

      - name: Commit and push
        working-directory: pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.md
          if git diff --staged --quiet; then
            echo "index.md already up to date"
          else
            git commit -m "Sync README → index.md from main repo"
            git push
          fi