name: Build Resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'resume/**'
      - '.github/workflows/build-resume.yml'
      - '!resume/resume.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF inside devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: resume/.devcontainer/devcontainer.json
          runCmd: latexmk -xelatex -interaction=nonstopmode -halt-on-error -cd resume/resume.tex

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume/resume.pdf
          if-no-files-found: error

      - name: Commit updated PDF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/resume.pdf
          if git diff --staged --quiet; then
            echo "No changes to resume.pdf"
          else
            git commit -m "chore(resume): rebuild PDF [skip ci]"
            git push
          fi
